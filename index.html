<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pro Minesweeper</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>💣 PRO Minesweeper</h1>

  <div class="topbar">
    <select id="difficulty">
      <option value="easy">Easy</option>
      <option value="medium">Medium</option>
      <option value="hard">Hard</option>
    </select>

    <button onclick="startGame()">Start</button>
    <button onclick="githubLogin()">🔐 Dev Login</button>
    <button id="devBtn" onclick="toggleDevMode()" disabled>Dev Mode</button>
  </div>

  <div class="stats">
    ⏱ <span id="timer">0</span>
    ⭐ <span id="score">0</span>
    👤 <span id="user"></span>
  </div>

  <div id="board"></div>
</div>

<script src="script.js"></script>
</body>
</html>
