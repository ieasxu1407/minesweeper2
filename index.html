<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>지뢰찾기 Ultimate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💣 지뢰찾기 Ultimate</h1>

<div class="controls">
  <select id="difficulty">
    <option value="easy">쉬움 (9x9)</option>
    <option value="medium">보통 (16x16)</option>
    <option value="hard">어려움 (24x24)</option>
  </select>

  <button onclick="startGame()">게임 시작</button>
  <button onclick="toggleDevMode()">👨‍💻 개발자모드</button>
  <button onclick="adminCheat()">🔥 관리자 치트</button>
</div>

<div id="board"></div>

<script src="script.js"></script>
</body>
</html>
