<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Minesweeper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>💣 Minesweeper</h1>

<div class="controls">
  <select id="difficulty">
    <option value="easy">쉬움 (8x8, 10개)</option>
    <option value="medium">보통 (12x12, 20개)</option>
    <option value="hard">어려움 (16x16, 40개)</option>
  </select>

  <button onclick="startGame()">게임 시작</button>
  <button onclick="toggleDevMode()">개발자모드</button>
</div>

<div class="info">
  ⏱ 시간: <span id="timer">0</span>초  
  ⭐ 점수: <span id="score">0</span>
</div>

<div id="board"></div>

<script src="script.js"></script>
</body>
</html>
